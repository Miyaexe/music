<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Music Player</h1>

    <section class="player">
      <div id="player"></div>
      <div class="now">
        <div id="now-title">🎲 ランダム探索を押すと、曲を探して再生します</div>
        <div id="now-status"></div>
      </div>

      <div class="controls">
        <button id="btn-prev" title="前の曲">⏮</button>
        <button id="btn-play" title="再生/一時停止">▶</button>
        <button id="btn-next" title="次の曲">⏭</button>
        <button id="btn-save" title="今の曲をプレイリストに追加">♡ 追加</button>
      </div>

      <div class="discover">
        <button id="btn-discover" class="toggle" title="YouTube Musicの曲をランダムに探して再生">🎲 ランダム探索</button>
        <label class="genre">
          ジャンル
          <select id="genre">
            <option value="">すべて</option>
          </select>
        </label>
      </div>

      <div class="controls sub">
        <button id="btn-shuffle" class="toggle" title="プレイリスト内をシャッフル">🔀 プレイリストをシャッフル</button>
        <button id="btn-repeat" class="toggle" title="プレイリストをリピート">🔁 リピート</button>
      </div>
    </section>

    <section class="add">
      <form id="add-form">
        <input id="add-input" type="text"
               placeholder="YouTube Music / YouTube のURL(曲・プレイリスト)を貼り付け" required>
        <button type="submit">追加</button>
      </form>
      <p class="hint">例: https://music.youtube.com/watch?v=xxxxxxxxxxx ／ https://music.youtube.com/playlist?list=PLxxxx<br>
        複数行にまとめて貼り付けることもできます。</p>
    </section>

    <section class="list">
      <div class="list-head">
        <h2>プレイリスト <span id="count"></span></h2>
        <button id="btn-clear" class="ghost">全削除</button>
      </div>
      <ol id="playlist"></ol>
    </section>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
